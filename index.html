<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 太空倉頡打字射擊戰機 - Type Shooter 3D</title>
    <!-- 使用 Tailwind CSS 快速排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-white overflow-hidden font-sans select-none perspective-root">

    <!-- 3D 雙層立體視差宇宙與科技網格背景 -->
    <div id="parallax-scene" class="fixed inset-0 pointer-events-none z-0">
        <div class="nebula-glow"></div>
        <div class="stars"></div>
        <div class="space-grid-ceiling"></div>
        <div class="space-grid-floor"></div>
        <div class="horizon-glow"></div>
    </div>

    <!-- 1. 遊戲開始畫面 (3D 懸浮全息玻璃面板) -->
    <div id="start-screen" class="fixed inset-0 flex flex-col items-center justify-center z-50 px-4 transition-all duration-500">
        <div id="start-card" class="holo-card-3d bg-slate-900/85 border-2 border-cyan-400/60 rounded-3xl p-8 max-w-md w-full shadow-[0_25px_70px_rgba(6,182,212,0.45)] backdrop-blur-xl relative overflow-hidden">
            <!-- 頂部科幻掃描光條 -->
            <div class="holo-scanline"></div>
            
            <div class="text-center mb-6 relative z-10">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-cyan-500/20 to-blue-600/20 border border-cyan-400/40 shadow-[0_0_30px_rgba(6,182,212,0.5)] mb-3 animate-float-3d">
                    <span class="text-5xl">🚀</span>
                </div>
                <h1 class="text-4xl font-black bg-gradient-to-r from-cyan-300 via-teal-200 to-blue-400 bg-clip-text text-transparent tracking-wider drop-shadow-[0_2px_10px_rgba(6,182,212,0.5)]">
                    倉頡打字戰機 3D
                </h1>
                <p class="text-cyan-400/80 mt-1.5 text-xs uppercase tracking-[0.25em] font-semibold">
                    Type Fighter: Hyper Space
                </p>
            </div>

            <form id="start-form" class="space-y-4 relative z-10">
                <div>
                    <label class="block text-xs font-bold text-cyan-300 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-user-astronaut text-cyan-400"></i> 玩家姓名 / 學號
                    </label>
                    <input type="text" id="player-name" required placeholder="例如: Chan Tai Man" 
                        class="w-full bg-slate-950/90 border-2 border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(34,211,238,0.4)] transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-cyan-300 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-users-rectangle text-cyan-400"></i> 班別
                    </label>
                    <input type="text" id="class-name" required placeholder="例如: 1A" 
                        class="w-full bg-slate-950/90 border-2 border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(34,211,238,0.4)] transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-cyan-300 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-layer-group text-cyan-400"></i> 起步關卡
                    </label>
                    <select id="start-level" class="w-full bg-slate-950/90 border-2 border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(34,211,238,0.4)] transition-all cursor-pointer">
                        <option value="1">第一關：倉頡基本字根 (極速反應 +1.3x)</option>
                        <option value="2">第二關：常用合體字 (2-3 碼進階挑戰)</option>
                        <option value="3">第三關：手冊高難度字 (4-5 碼終極決戰)</option>
                    </select>
                </div>
                <button type="submit" class="btn-3d-launch w-full bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-600 hover:from-cyan-400 hover:to-blue-500 text-white font-black py-3.5 px-4 rounded-xl shadow-[0_8px_25px_rgba(6,182,212,0.5)] active:translate-y-1 transition-all duration-150 mt-6 tracking-widest text-base">
                    啟動 3D 戰機出擊 <i class="fa-solid fa-shuttle-space ml-1.5"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- 2. 遊戲主畫面 (3D 駕駛艙 HUD 與立體透視戰場) -->
    <div id="game-screen" class="hidden fixed inset-0 flex flex-col justify-between z-10">
        
        <!-- 頂部 3D 弧形全息駕駛艙 HUD -->
        <div class="hud-cockpit-bar m-3 px-6 py-3 bg-slate-900/75 border border-cyan-500/40 rounded-2xl backdrop-blur-md flex justify-between items-center z-30 shadow-[0_10px_30px_rgba(0,0,0,0.6),inset_0_1px_1px_rgba(255,255,255,0.2)]">
            <!-- 左側：駕駛員與進度條 -->
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-cyan-500/20 border border-cyan-400/50 flex items-center justify-center text-cyan-300 shadow-[0_0_12px_rgba(34,211,238,0.4)]">
                        <i class="fa-solid fa-helmet-safety"></i>
                    </div>
                    <div>
                        <span class="text-[10px] text-cyan-400/80 uppercase tracking-widest block font-bold">戰機駕駛員</span>
                        <span id="hud-player" class="font-extrabold text-white text-sm tracking-wide">-</span>
                    </div>
                </div>

                <!-- 關卡擊破進度 (10顆星目標) -->
                <div class="hidden sm:block border-l border-slate-700/80 pl-6">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] text-cyan-400/80 uppercase tracking-widest font-bold">躍遷充能進度</span>
                        <span id="hud-progress-text" class="text-[11px] font-mono font-bold text-cyan-300">0 / 10</span>
                    </div>
                    <div class="w-32 h-2 bg-slate-950 rounded-full overflow-hidden border border-slate-700 p-0.5">
                        <div id="hud-progress-bar" class="h-full bg-gradient-to-r from-cyan-400 to-blue-500 rounded-full transition-all duration-300 shadow-[0_0_8px_#22d3ee]" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 中央：3D 懸浮積分與連擊儀表 -->
            <div class="flex items-center gap-8">
                <div class="text-center">
                    <span class="text-[10px] text-amber-300/80 uppercase tracking-widest block font-bold">作戰總分 SCORE</span>
                    <span id="hud-score" class="font-mono text-2xl font-black text-yellow-400 drop-shadow-[0_0_12px_rgba(250,204,21,0.6)] inline-block transition-transform duration-150">0</span>
                </div>
                <div class="text-center">
                    <span class="text-[10px] text-emerald-300/80 uppercase tracking-widest block font-bold">連擊 COMBO</span>
                    <div id="hud-combo-box" class="inline-flex items-baseline gap-0.5 transition-transform duration-150">
                        <span id="hud-combo" class="font-mono text-2xl font-black text-emerald-400 drop-shadow-[0_0_12px_rgba(52,211,153,0.6)]">0</span>
                        <span class="text-xs font-bold text-emerald-500">x</span>
                    </div>
                </div>
            </div>
            
            <!-- 右側：能量護盾條與任務關卡 -->
            <div class="flex items-center gap-6">
                <div class="w-32">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] text-cyan-400/80 uppercase tracking-widest font-bold">能量護盾 SHIELD</span>
                        <span id="hud-shield-pct" class="font-mono text-xs font-black text-cyan-400">100%</span>
                    </div>
                    <div class="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden border border-slate-700 p-0.5">
                        <div id="hud-shield-bar" class="h-full bg-gradient-to-r from-cyan-400 to-teal-300 rounded-full transition-all duration-200 shadow-[0_0_10px_#22d3ee]" style="width: 100%"></div>
                    </div>
                </div>
                <div class="text-right border-l border-slate-700/80 pl-5">
                    <span class="text-[10px] text-indigo-300/80 uppercase tracking-widest block font-bold">當前星區 MISSION</span>
                    <span id="hud-level" class="font-black text-sm text-indigo-300 drop-shadow-[0_0_8px_rgba(129,140,248,0.5)]">第一關</span>
                </div>
            </div>
        </div>

        <!-- 核心 3D 戰場 (隕石遠近透視下落 + 雷射與3D星空粒子 Canvas 層) -->
        <div id="game-area" class="relative flex-1 overflow-hidden stage-3d">
            
            <!-- 動態 3D 穿梭星塵、雙聯裝雷射、震波與浮動得分 Canvas 層 -->
            <canvas id="laser-canvas" class="absolute inset-0 pointer-events-none z-10"></canvas>

            <!-- 3D 傾角戰機複合體 (跟隨目標自動微傾轉向 + 立體雙層能量球) -->
            <div id="player-ship" class="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center z-20 ship-3d-wrapper">
                
                <!-- 戰機 3D 立體球形防護罩 (內外雙環旋轉) -->
                <div id="ship-shield" class="absolute -top-4 w-28 h-28 rounded-full border-4 border-cyan-400/80 flex items-center justify-center transition-all duration-150 pointer-events-none shield-3d-sphere">
                    <div class="shield-inner-ring"></div>
                    <div class="absolute inset-0 rounded-full bg-radial-shield animate-pulse"></div>
                </div>

                <!-- 戰機本體容器 (支援左右 3D Roll 翻滾傾角與發射後座力) -->
                <div id="ship-hull" class="w-20 h-20 relative z-10 transition-transform duration-200 ease-out drop-shadow-[0_15px_20px_rgba(0,0,0,0.85)]">
                    <svg viewBox="0 0 64 64" class="w-full h-full overflow-visible">
                        <defs>
                            <linearGradient id="ship-body" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#e0f2fe" />
                                <stop offset="40%" stop-color="#06b6d4" />
                                <stop offset="100%" stop-color="#1d4ed8" />
                            </linearGradient>
                            <linearGradient id="ship-wing-left" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#0284c7" />
                                <stop offset="100%" stop-color="#1e293b" />
                            </linearGradient>
                            <linearGradient id="ship-wing-right" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#1e293b" />
                                <stop offset="100%" stop-color="#0284c7" />
                            </linearGradient>
                            <linearGradient id="cockpit-glass" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#fef08a" />
                                <stop offset="50%" stop-color="#f59e0b" />
                                <stop offset="100%" stop-color="#b45309" />
                            </linearGradient>
                        </defs>
                        <!-- 底部機翼陰影層 (強立體感) -->
                        <polygon points="32,8 6,48 18,46 32,56 46,46 58,48" fill="rgba(0,0,0,0.5)" transform="translate(0, 5)" />
                        <!-- 左右雙聯裝重型雷射炮管 -->
                        <rect x="13" y="18" width="3.5" height="16" rx="1.5" fill="#38bdf8" stroke="#bae6fd" stroke-width="0.8" />
                        <rect x="47.5" y="18" width="3.5" height="16" rx="1.5" fill="#38bdf8" stroke="#bae6fd" stroke-width="0.8" />
                        <!-- 3D 斜角主機翼 -->
                        <polygon points="32,14 4,46 22,42 26,48 32,44" fill="url(#ship-wing-left)" stroke="#38bdf8" stroke-width="0.8" />
                        <polygon points="32,14 60,46 42,42 38,48 32,44" fill="url(#ship-wing-right)" stroke="#38bdf8" stroke-width="0.8" />
                        <!-- 戰機中央稜角核心機身 -->
                        <polygon points="32,2 21,28 18,46 32,56 46,46 43,28" fill="url(#ship-body)" stroke="#ffffff" stroke-width="1" />
                        <!-- 機身立體中脊線 -->
                        <polygon points="32,2 28,36 32,52 36,36" fill="rgba(255,255,255,0.28)" />
                        <!-- 黃金流光駕駛艙罩 -->
                        <ellipse cx="32" cy="25" rx="4.5" ry="10" fill="url(#cockpit-glass)" stroke="#fef9c3" stroke-width="0.8" />
                        <ellipse cx="30.5" cy="22" rx="1.5" ry="4" fill="rgba(255,255,255,0.8)" />
                    </svg>
                </div>

                <!-- 雙噴嘴等離子推進尾焰 -->
                <div class="flex gap-3 -mt-2 z-0">
                    <div class="ship-thruster w-2.5 h-9 bg-gradient-to-t from-transparent via-cyan-400 to-white rounded-b-full"></div>
                    <div class="ship-thruster w-3 h-11 bg-gradient-to-t from-transparent via-orange-500 to-yellow-200 rounded-b-full"></div>
                    <div class="ship-thruster w-2.5 h-9 bg-gradient-to-t from-transparent via-cyan-400 to-white rounded-b-full"></div>
                </div>
                
                <!-- 3D 全息鍵盤拆碼指示器 (隨打字呈現立體按鍵彈跳) -->
                <div id="floating-input-badge" class="mt-2 bg-slate-900/95 border-2 border-cyan-400/70 px-4 py-1.5 rounded-2xl text-xs font-mono font-bold text-cyan-300 shadow-[0_8px_25px_rgba(6,182,212,0.5)] whitespace-nowrap min-w-[110px] text-center transition-all duration-150 flex items-center justify-center gap-1.5">
                    <span class="text-slate-400">READY</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 結算與排行榜畫面 (3D 獎盃榮譽殿堂) -->
    <div id="end-screen" class="hidden fixed inset-0 flex flex-col items-center justify-center z-50 px-4 transition-all duration-500">
        <div class="holo-card-3d bg-slate-900/95 border-2 border-emerald-400/60 rounded-3xl p-8 max-w-2xl w-full shadow-[0_25px_80px_rgba(16,185,129,0.35)] backdrop-blur-xl relative overflow-hidden">
            <div class="holo-scanline"></div>
            <div class="text-center mb-6 relative z-10">
                <h2 id="end-title" class="text-4xl font-black text-emerald-400 tracking-wider">任務完成</h2>
                <p class="text-slate-400 mt-1 text-xs uppercase tracking-widest">數據已同步儲存於本機星際紀錄 (LocalStorage)</p>
            </div>

            <!-- 3D 立體數據統計卡 -->
            <div class="grid grid-cols-3 gap-4 mb-8 text-center relative z-10">
                <div class="stat-box-3d bg-slate-950/90 p-4 rounded-2xl border border-slate-800 shadow-inner">
                    <span class="text-xs text-slate-400 font-bold block mb-1">最終得分</span>
                    <span id="end-score" class="text-3xl font-black text-yellow-400 font-mono drop-shadow-[0_0_10px_rgba(250,204,21,0.5)]">0</span>
                </div>
                <div class="stat-box-3d bg-slate-950/90 p-4 rounded-2xl border border-slate-800 shadow-inner">
                    <span class="text-xs text-slate-400 font-bold block mb-1">射擊精準度</span>
                    <span id="end-accuracy" class="text-3xl font-black text-cyan-400 font-mono drop-shadow-[0_0_10px_rgba(34,211,238,0.5)]">0%</span>
                </div>
                <div class="stat-box-3d bg-slate-950/90 p-4 rounded-2xl border border-slate-800 shadow-inner">
                    <span class="text-xs text-slate-400 font-bold block mb-1">到達星區</span>
                    <span id="end-level" class="text-3xl font-black text-indigo-400 font-mono drop-shadow-[0_0_10px_rgba(129,140,248,0.5)]">1</span>
                </div>
            </div>

            <!-- 本地前十排行榜 -->
            <div class="mb-6 relative z-10">
                <h3 class="text-sm font-extrabold text-cyan-300 uppercase tracking-widest mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-trophy text-yellow-400 animate-bounce"></i> 本機 Top 10 王牌機師排行榜
                </h3>
                <div class="bg-slate-950/90 rounded-2xl overflow-hidden border border-slate-800 max-h-48 overflow-y-auto shadow-inner">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900/90 text-xs font-bold text-slate-400 uppercase border-b border-slate-800">
                                <th class="py-2.5 px-4">名次</th>
                                <th class="py-2.5 px-4">班別</th>
                                <th class="py-2.5 px-4">機師姓名</th>
                                <th class="py-2.5 px-4 text-right">最高戰績</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body" class="text-sm">
                            <!-- JS 動態渲染本機紀錄 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="flex gap-4 relative z-10">
                <button id="restart-btn" class="btn-3d-launch flex-1 bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black py-3.5 px-4 rounded-xl shadow-[0_8px_25px_rgba(16,185,129,0.4)] active:translate-y-1 transition-all duration-150 tracking-wider">
                    再次駕駛戰機出擊 <i class="fa-solid fa-rotate-right ml-1.5"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 載入核心 3D 互動邏輯 -->
    <script src="game.js"></script>
</body>
</html>
